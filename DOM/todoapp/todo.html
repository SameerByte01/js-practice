<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToDoApp</title>
    <link rel="stylesheet" href="todo.css" />
  </head>

  <body>
    <h1>ToDo App</h1>
    <input id="task" type="text" placeholder="Enter a text" />
    <div class="btn">
      <button onclick="addTask()">+</button>
      <button onclick="removeTask()">reset</button>
    </div>
    <div class="theme">
      <button onclick="darktheme()">Dark</button>
      <button onclick="lighttheme()">White</button>
    </div>
    <ul id="list"></ul>
  </body>

  <script src="todo.js"></script>
</html>
